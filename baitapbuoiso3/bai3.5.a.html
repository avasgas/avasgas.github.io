<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
 <div class="container mt-3">
  <h3>Xác thực biểu mẫu</h3>
  <p>Ví dụ bạn gửi biểu mẫu nhưng chưa điền hết thông tin thì sẽ nhận được thông báo như bên dưới.</p>
  
  <form action="/action_page.php" class="was-validated">
    <div class="mb-3 mt-3">
      <label for="uname" class="form-label">Tên người dùng:</label>
      <input 
        type="text" 
        class="form-control" 
        id="uname" 
        placeholder="Nhập tên người dùng" 
        name="uname" 
        required 
      />
      <div class="valid-feedback">Hợp lệ.</div>
      <div class="invalid-feedback">Điền đầy đủ thông tin.</div>
    </div>

    <div class="mb-3">
      <label for="pwd" class="form-label">Mật khẩu:</label>
      <input 
        type="password" 
        class="form-control" 
        id="pwd" 
        placeholder="Enter password" 
        name="pswd" 
        required 
      />
      <div class="valid-feedback">Hợp lệ.</div>
      <div class="invalid-feedback">Điền đầy đủ thông tin.</div>
    </div>

    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="myCheck" name="remember" required />
      <label class="form-check-label" for="myCheck">Đồng ý</label>
      <div class="invalid-feedback">Đánh dấu vào ô này để tiếp tục.</div>
    </div>

    <button type="submit" class="btn btn-primary">Đăng nhập</button>
  </form>
</div>
    </body>
</html>
