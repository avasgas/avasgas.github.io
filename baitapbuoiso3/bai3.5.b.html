<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
<div class="container mt-4" style="max-width: 700px;">
      <h3 class="mb-4">Registration Form</h3>

      <form>
        <div class="row mb-3 align-items-center">
          <label for="firstName" class="col-sm-3 col-form-label">First Name:</label>
          <div class="col-sm-9">
            <input type="text" class="form-control" id="firstName" placeholder="First Name" />
          </div>
        </div>

        <div class="row mb-3 align-items-center">
          <label for="lastName" class="col-sm-3 col-form-label">Last Name:</label>
          <div class="col-sm-9">
            <input type="text" class="form-control" id="lastName" placeholder="Last Name" />
          </div>
        </div>

        <div class="row mb-3 align-items-center">
          <label for="email" class="col-sm-3 col-form-label">Email Address:</label>
          <div class="col-sm-9">
            <input type="email" class="form-control" id="email" placeholder="Email Address" />
          </div>
        </div>

        <div class="row mb-3 align-items-center">
          <label for="phone" class="col-sm-3 col-form-label">Mobile Number:</label>
          <div class="col-sm-9">
            <input type="tel" class="form-control" id="phone" placeholder="Phone Number" />
          </div>
        </div>

        <div class="row mb-3 align-items-center">
          <label class="col-sm-3 col-form-label">Date of Birth:</label>
          <div class="col-sm-9">
            <div class="row g-2">
              <div class="col">
                <select class="form-select">
                  <option selected>Date</option>
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="2">3</option>
                  <option value="2">4</option>
                  <option value="2">5</option>
                  <option value="2">6</option>
                  <option value="2">7</option>
                  <option value="2">8</option>
                  <option value="2">9</option>
                  <option value="2">10</option>
                </select>
              </div>
              <div class="col">
                <select class="form-select">
                  <option selected>Month</option>
                  <option value="1">January</option>
                  <option value="2">February</option>
                </select>
              </div>
              <div class="col">
                <select class="form-select">
                  <option selected>Year</option>
                  <option value="2000">2000</option>
                  <option value="2001">2001</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="row mb-3">
          <label for="address" class="col-sm-3 col-form-label">Postal Address:</label>
          <div class="col-sm-9">
            <textarea class="form-control" id="address" rows="3" placeholder="Postal Address"></textarea>
          </div>
        </div>

        <div class="row mb-3 align-items-center">
          <label for="zipCode" class="col-sm-3 col-form-label">Zip Code:</label>
          <div class="col-sm-9">
            <input type="text" class="form-control" id="zipCode" placeholder="Zip Code" />
          </div>
        </div>

        <div class="row mb-3 align-items-center">
          <label for="uploadImage" class="col-sm-3 col-form-label">Upload Image:</label>
          <div class="col-sm-9">
            <input class="form-control" type="file" id="uploadImage" />
          </div>
        </div>

        <div class="row mb-3 align-items-center">
          <label class="col-sm-3 col-form-label">Gender:</label>
          <div class="col-sm-9">
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="male" value="male" />
              <label class="form-check-label" for="male">Male</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="gender" id="female" value="female" />
              <label class="form-check-label" for="female">Female</label>
            </div>
          </div>
        </div>

        <div class="row mb-4">
          <div class="col-sm-9 offset-sm-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="terms" />
              <label class="form-check-label" for="terms">
                I agree to the <a href="#" class="text-decoration-underline">Terms and Conditions</a>
              </label>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="col-sm-9 offset-sm-3">
            <button type="submit" class="btn btn-dark me-2">Submit</button>
            <button type="reset" class="btn btn-secondary">Reset</button>
          </div>
        </div>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
