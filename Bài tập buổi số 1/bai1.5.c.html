    <!doctype html>
    <html lang="en" data-bs-theme="light">
        <head>
    <title>Ví dụ về Bootstrap 5</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
                .box {
            background-color: #db3838;
            border: 5px solid rgb(141, 179, 65);
            height: 50px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
                }
    </style>
    </head>
    <body>
<div class="container">
    <div class="row">
        <div class="col-md-6" >
          <div class="box">.col-md-6</div> 
        </div>
        <div class="col-md-6" >
            <div class="box">.col-md-6</div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4" >
            <div class="box">.col-md-4</div>
        </div>
        <div class="col-md-8" >
            <div class="box">.col-md-8</div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-3" >
           <div class="box">.col-md-3</div>
        </div>
        <div class="col-md-9" >
            <div class="box">.col-md-9</div>
        </div>
    </div>
</div>
