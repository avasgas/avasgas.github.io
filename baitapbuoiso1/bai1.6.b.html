<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <title>Ví dụ về Bootstrap 5</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-color: #f5f5f5;
        }
        .box,
        .card-box {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }
        .box{
            padding-bottom: 150px;
        }
        .logo {
            text-align: center;
            color: #0d6efd;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container" style="margin-top: 20px;">
        <div class="row align-items-stretch">
            <div class="col-lg-2">
                <div class="box">
                    <div class="logo">
                        <h1>LOGO</h1>
                    </div>
                    <ul class="list-group">
                        <li class="list-group-item active">Dashboard</li>
                        <li class="list-group-item">Age</li>
                        <li class="list-group-item">Gender</li>
                        <li class="list-group-item">Geo</li>
                    </ul>
                </div>
            </div>

            <div class="col-lg-9">
                <div class="row mb-3">
                    <div class="col-lg-12">
                        <div class="card-box">
                            Dashboard<br>
                            Some text
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-lg-3">
                        <div class="card-box">
                            User<br>
                            1 Million
                        </div>
                    </div>
                    <div class="col-lg-3">
                        <div class="card-box">
                            Pages<br>
                            100 Million
                        </div>
                    </div>
                    <div class="col-lg-3">
                        <div class="card-box">
                            Sessions<br>
                            10 Million
                        </div>
                    </div>
                    <div class="col-lg-3">
                        <div class="card-box">
                            Bounce<br>
                            30%
                        </div>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-lg-4">
                        <div class="card-box">
                            Text<br>
                            Text<br>
                            Text
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="card-box">
                            Text<br>
                            Text<br>
                            Text
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="card-box">
                            Text<br>
                            Text<br>
                            Text
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-lg-6">
                        <div class="card-box">
                            Text
                        </div>
                    </div>
                    <div class="col-lg-6">
                        <div class="card-box">
                            Text
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
