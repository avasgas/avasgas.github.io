    <!doctype html>
    <html lang="en" data-bs-theme="light">
        <head>
    <title>Ví dụ về Bootstrap 5</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .box {
            background-color: #8fcc2d;
            border: 5px solid rgb(193, 27, 27);
            min-height: 100px;
        }
    </style>

    <body>
        <div class="container">
            <div class="row">
                <div class="col-md-8">
                    <div class="box"></div>
                </div>
                <div class="col-md-4">
                    <div class="row">
                        <div class="col-md-12">
                            <div class="box"></div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="box"></div>
                        </div>
                        <div class="col-md-6">
                            <div class="box"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </body>
        </html>
